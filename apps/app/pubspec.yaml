name: edtech_app
description: Unified EdTech ecosystem client for classroom management, collaboration and integrity monitoring.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  go_router: ^14.2.7
  provider: ^6.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # 2.5.x adds package:jni, which builds native code and requires the Android NDK.
  # 2.4.28 is the last pure-Kotlin implementation, so the APK needs no NDK.
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
